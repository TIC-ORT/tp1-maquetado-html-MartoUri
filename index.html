<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tp ivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
        }
        
        .header {
            background-color: #7dd0d8;
            padding: 0;
            position: relative;
        }
        
        .nav-bar {
            display: flex;
            height: 40px;
            width: 100%;
        }
        
        .logo {
            width: 80px;
            height: 40px;
            background-color: #f87e63;
        }
        
        .menu-left {
            width: 170px;
            height: 40px;
            background-color: #e6e6e6;
        }
        
        .menu-center {
            flex: 1;
            height: 40px;
            background-color: #b3b3b3;
        }
        
        .search-container {
            background-color: #e6e6e6;
            padding: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .search-bar {
            width: 92%;
            height: 25px;
            background-color: #ffffff;
            border-radius: 0;
            margin: 0 auto;
        }
        
        .nav-controls {
            display: flex;
            align-items: center;
            background-color: #e6e6e6;
            padding: 0 10px;
            gap: 10px;
            width: 80px;
        }
        
        .nav-control {
            width: 18px;
            height: 18px;
            background-color: #b3b3b3;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="nav-bar">
            <div class="logo"></div>
            <div class="menu-left"></div>
            <div class="menu-center"></div>
            <div class="nav-controls">
                <div class="nav-control"></div>
                <div class="nav-control"></div>
            </div>
        </div>
    </header>
    
    <div class="search-container">
        <div class="search-bar"></div>
    </div>
    
    <section class="hero">
        <div class="hero-content">
            <div class="hero-image"></div>
            <div class="hero-text">
                <div class="hero-title"></div>
                <div class="hero-paragraph"></div>
                <div class="hero-paragraph"></div>
                <div class="hero-paragraph"></div>
                <div class="hero-paragraph short"></div>
            </div>
        </div>
    </section>
    
    <section class="features">
        <div class="feature-grid">
            <div class="feature">
                <div class="feature-icon"></div>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
            </div>
        </div>
    </section>
    
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-column">
                <div class="footer-heading"></div>
                <div class="footer-text"></div>
                <div class="footer-text"></div>
                <div class="footer-text short"></div>
            </div>
            <div class="footer-column">
                <div class="footer-heading"></div>
                <div class="footer-text"></div>
                <div class="footer-text"></div>
                <div class="footer-text short"></div>
            </div>
            <div class="footer-column">
                <div class="footer-heading"></div>
                <div class="footer-text"></div>
                <div class="footer-text"></div>
                <div class="footer-text short"></div>
            </div>
        </div>
    </footer>
</body>
</html>
